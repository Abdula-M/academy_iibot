# ============================================================
# GitLab CI/CD Pipeline для автодеплоя AI Bot
# ============================================================

stages:
  - test
  - deploy

# ---- STAGE 1: Проверка кода ----
lint:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install ruff
  script:
    - ruff check . --ignore E501 --exclude .venv,__pycache__,chroma_data
  allow_failure: true

# ---- STAGE 2: Деплой на сервер ----
deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config'
  script:
    - ssh $SERVER_USER@$SERVER_HOST "cd /root/academy_iibot && git pull gitlab main && docker compose up -d --build && sleep 10 && docker ps"
  only:
    - main
  environment:
    name: production
    url: https://academy-skfo.online
