<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд — Академия СКФО Бот</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-base: #090a0f;
            --bg-glass: rgba(20, 22, 31, 0.65);
            --bg-glass-hover: rgba(30, 34, 49, 0.85);
            --bg-glass-active: rgba(45, 52, 74, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
        }

        [data-theme="light"] {
            --bg-base: #f8fafc;
            --bg-glass: rgba(255, 255, 255, 0.75);
            --bg-glass-hover: rgba(241, 245, 249, 0.85);
            --bg-glass-active: rgba(226, 232, 240, 0.85);
            --border-glass: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-dim: #475569;
            --accent-primary: #2563eb;
            --accent-secondary: #7c3aed;
            --accent-green: #059669;
            --accent-orange: #d97706;
            --accent-red: #dc2626;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.12), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.12), transparent 25%);
        }

        /* ── Header ─────────────────────────────────── */
        .header {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, #fff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-stats {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 14px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.03);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
        }

        .stat-label { color: var(--text-dim); }
        .stat-val { font-weight: 600; color: var(--text-main); }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--accent-green); }
            50% { opacity: 0.5; box-shadow: 0 0 2px var(--accent-green); }
        }

        /* ── Layout ─────────────────────────────────── */
        .app-container {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }

        /* ── Sidebar ────────────────────── */
        .sidebar {
            width: 360px;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-right: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 5;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-glass);
        }

        .users-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .users-list::-webkit-scrollbar { width: 4px; }
        .users-list::-webkit-scrollbar-track { background: transparent; }
        .users-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .user-item {
            padding: 16px;
            border-radius: 12px;
            background: rgba(255,255,255,0.02);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .user-item:hover {
            background: var(--bg-glass-hover);
            border-color: var(--border-glass);
            transform: translateY(-1px);
        }

        .user-item.active {
            background: var(--bg-glass-active);
            border-color: var(--accent-primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .user-name {
            font-weight: 600;
            color: var(--accent-primary);
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 170px;
        }

        .user-time {
            font-size: 12px;
            color: var(--text-dim);
        }

        .user-preview {
            font-size: 13px;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 24px;
        }

        .user-badge {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #fff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* ── Chat Area ──────────────────────────────── */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: transparent;
            position: relative;
        }

        .chat-header {
            padding: 16px 24px;
            background: rgba(20, 22, 31, 0.4);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 5;
            flex-shrink: 0;
        }

        .mobile-back-btn {
            display: none;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .mobile-back-btn:hover { background: rgba(255,255,255,0.2); }

        .chat-header-title {
            font-weight: 600;
            font-size: 18px;
            color: #fff;
        }

        .chat-header-sub {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .msg-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 70%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-wrapper.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-wrapper.bot {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-bubble {
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .msg-wrapper.user .msg-bubble {
            background: linear-gradient(135deg, var(--accent-primary), #2563eb);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg-wrapper.bot .msg-bubble {
            background: rgba(45, 52, 74, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        .msg-time {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 6px;
            padding: 0 4px;
        }

        /* ── States ─────────────────── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-dim);
            text-align: center;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.8;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.1));
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-dim);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .msg-bubble b { font-weight: 600; color: #fff; }
        .msg-bubble i { font-style: italic; color: #cbd5e1; }

        /* ── Buttons & Modal ──────────────────────────────────── */
        .wa-status-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .wa-status-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-1px);
        }
        
        .wa-dot {
            width: 10px; height: 10px; border-radius: 50%;
        }
        .wa-dot.offline { background: var(--accent-red); box-shadow: 0 0 8px rgba(239, 68, 68, 0.5); }
        .wa-dot.online { background: var(--accent-green); box-shadow: 0 0 8px rgba(16, 185, 129, 0.5); }
        .wa-dot.qr { background: var(--accent-orange); box-shadow: 0 0 8px rgba(245, 158, 11, 0.5); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.open {
            opacity: 1; pointer-events: auto;
        }
        .modal-content {
            background: #1a1d27;
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 32px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s ease;
        }
        .modal-overlay.open .modal-content {
            transform: translateY(0) scale(1);
        }
        .modal-close {
            position: absolute;
            top: 16px; right: 16px;
            cursor: pointer;
            color: var(--text-dim);
            font-size: 24px;
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            transition: all 0.2s;
        }
        .modal-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
        
        #qr-container {
            margin: 24px auto;
            background: #fff;
            padding: 16px;
            border-radius: 16px;
            display: inline-block;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-danger:hover {
            background: #ef4444;
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        /* ── Theme Specific Overrides ──────────────── */
        [data-theme="light"] body {
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(37, 99, 235, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(124, 58, 237, 0.08), transparent 25%);
        }
        [data-theme="light"] .header-title {
            background: linear-gradient(135deg, #0f172a, #475569);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        [data-theme="light"] .chat-header { background: rgba(255, 255, 255, 0.6); }
        [data-theme="light"] .msg-wrapper.bot .msg-bubble {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }
        [data-theme="light"] .user-item { background: rgba(0,0,0,0.02); }
        [data-theme="light"] .stat-item { background: rgba(0,0,0,0.03); }
        [data-theme="light"] .modal-content { background: #ffffff; }
        [data-theme="light"] .empty-state .icon { filter: drop-shadow(0 0 20px rgba(0,0,0,0.05)); }
        [data-theme="light"] .spinner { border: 3px solid rgba(0,0,0,0.1); border-top-color: var(--accent-primary); }
        [data-theme="light"] .wa-status-btn { background: rgba(0,0,0,0.04); }
        [data-theme="light"] .wa-status-btn:hover { background: rgba(0,0,0,0.08); }
        [data-theme="light"] .modal-close { background: rgba(0,0,0,0.05); }
        [data-theme="light"] .modal-close:hover { background: rgba(0,0,0,0.1); color: #000; }
        [data-theme="light"] .msg-bubble b { color: #fff; }
        [data-theme="light"] .msg-wrapper.bot .msg-bubble b { color: #0f172a; }
        [data-theme="light"] .msg-bubble i { color: #cbd5e1; }
        [data-theme="light"] .msg-wrapper.bot .msg-bubble i { color: #475569; }
        [data-theme="light"] .mobile-back-btn {
            background: rgba(0,0,0,0.05);
            color: #0f172a;
        }
        [data-theme="light"] .mobile-back-btn:hover {
            background: rgba(0,0,0,0.1);
        }

        /* ── Theme Toggle Button ──────────────── */
        .theme-toggle {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
        }
        .theme-toggle:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.05);
        }
        [data-theme="light"] .theme-toggle {
            background: rgba(0,0,0,0.05);
        }
        [data-theme="light"] .theme-toggle:hover {
            background: rgba(0,0,0,0.1);
        }

        /* ── Mobile Responsiveness ─────────────────── */
        @media (max-width: 900px) {
            body { height: 100dvh; }
            .header {
                flex-direction: column;
                padding: 16px;
                gap: 12px;
                height: auto;
            }
            .header-title { font-size: 18px; }
            .header-stats {
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
                width: 100%;
            }
            .app-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 100%;
                border-right: none;
            }
            .users-list {
                padding: 12px;
            }
            .user-item {
                width: 100%;
            }
            .chat-area {
                display: none;
                width: 100%;
                height: 100%;
            }
            .msg-wrapper { max-width: 90%; }
            .chat-header { padding: 12px 16px; gap: 12px; }

            /* State when chat is active */
            .app-container.chat-active .sidebar {
                display: none;
            }
            .app-container.chat-active .chat-area {
                display: flex;
            }
            .mobile-back-btn {
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }
    </style>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>

<header class="header">
    <div class="header-title">
        <span class="icon" style="font-size: 24px;">✨</span>
        Академия СКФО Dashboard
    </div>
    <div class="header-stats">
        <button class="wa-status-btn" onclick="openWaModal()">
            <div class="wa-dot offline" id="wa-dot"></div>
            WhatsApp: <span id="wa-status-text">OFFLINE</span>
        </button>
        <div class="stat-item">
            <span class="stat-label">Всего:</span>
            <span class="stat-val" id="total-users">-</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Активных:</span>
            <span class="stat-val" id="today-users">-</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Сообщений:</span>
            <span class="stat-val" id="today-messages">-</span>
        </div>
        <div class="stat-item" style="background: transparent; border: none; padding-left: 0;">
            <div class="status-dot"></div>
            <span class="stat-label" id="last-update" style="font-size: 12px;">Обновлено</span>
        </div>
        <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()" title="Переключить тему">
            🌙
        </button>
    </div>
</header>

<div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            Недавние диалоги
        </div>
        <div class="users-list" id="users-list">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    </aside>

    <!-- Chat Area -->
    <main class="chat-area">
        <div class="chat-header" id="chat-header" style="display: none;">
            <button class="mobile-back-btn" onclick="backToList()">&#8592;</button>
            <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; flex-shrink: 0;">
                @
            </div>
            <div>
                <div class="chat-header-title" id="chat-title">@username</div>
                <div class="chat-header-sub" id="chat-sub">telegram_id</div>
            </div>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="empty-state">
                <div class="icon">🌌</div>
                <div style="font-size: 18px; font-weight: 500; margin-bottom: 8px;">Выберите диалог</div>
                <div style="font-size: 14px;">чтобы просмотреть историю сообщений</div>
            </div>
        </div>
    </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="wa-modal" onclick="if(event.target===this) closeWaModal()">
    <div class="modal-content">
        <div class="modal-close" onclick="closeWaModal()">&times;</div>
        <h3 style="margin-bottom: 12px; font-size: 22px;">WhatsApp Подключение</h3>
        <p id="wa-modal-desc" style="font-size: 14px; color: var(--text-dim);">
            Загрузка статуса...
        </p>
        <div id="qr-container"></div>
        <button id="wa-logout-btn" class="btn-danger" style="display: none;" onclick="logoutWa()">Отвязать WhatsApp</button>
    </div>
</div>

<script>
    const API_BASE = window.location.origin;
    let currentSelectedUserId = null;
    let autoRefreshInterval = null;

    // ── Утилиты ─────────────────────────────────────────
    function formatTime(isoString) {
        if (!isoString) return '';
        const date = new Date(isoString);
        return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    function formatDate(isoString) {
        if (!isoString) return '';
        const date = new Date(isoString);
        const now = new Date();
        if (date.toDateString() === now.toDateString()) return formatTime(isoString);
        return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) + ' ' + formatTime(isoString);
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatBotAnswer(htmlText) {
        // Простая санация, чтобы разрешить только <b>, <i>, <br>
        // В реальном проекте лучше использовать DOMPurify
        let text = htmlText.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        text = text.replace(/&lt;b&gt;/g, '<b>').replace(/&lt;\/b&gt;/g, '</b>');
        text = text.replace(/&lt;i&gt;/g, '<i>').replace(/&lt;\/i&gt;/g, '</i>');
        text = text.replace(/\n/g, '<br>');
        return text;
    }

    // ── API Вызовы ──────────────────────────────────────
    async function loadStats() {
        try {
            const resp = await fetch(`${API_BASE}/api/stats`);
            const data = await resp.json();
            document.getElementById('total-users').textContent = data.total_users;
            document.getElementById('today-users').textContent = data.today_users;
            document.getElementById('today-messages').textContent = data.today_messages;
            
            const now = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('last-update').textContent = `Обновлено в ${now}`;
        } catch (err) {
            console.error('Ошибка загрузки статистики', err);
        }
    }

    async function loadUsersList() {
        try {
            const resp = await fetch(`${API_BASE}/api/users`);
            const users = await resp.json();
            const listEl = document.getElementById('users-list');

            if (users.length === 0) {
                listEl.innerHTML = '<div class="empty-state" style="padding: 20px; font-size: 13px;">Нет данных</div>';
                return;
            }

            listEl.innerHTML = users.map(user => `
                <div class="user-item ${currentSelectedUserId === user.telegram_id ? 'active' : ''}" 
                     onclick="selectUser(${user.telegram_id}, '${escapeHtml(user.username)}')">
                    <div class="user-header">
                        <div class="user-name">@${escapeHtml(user.username)}</div>
                        <div class="user-time">${formatDate(user.last_time)}</div>
                    </div>
                    <div class="user-preview">${escapeHtml(user.last_question)}</div>
                    <div class="user-badge">${user.msg_count}</div>
                </div>
            `).join('');
        } catch (err) {
            console.error('Ошибка загрузки списка пользователей', err);
        }
    }

    async function loadUserMessages(telegramId) {
        try {
            const chatEl = document.getElementById('chat-messages');
            
            // Если только переключились на пользователя, показываем загрузку
            if (chatEl.dataset.loadingId !== String(telegramId)) {
                chatEl.dataset.loadingId = telegramId;
                chatEl.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            }

            const resp = await fetch(`${API_BASE}/api/messages/${telegramId}`);
            const messages = await resp.json();

            // Проверяем, не переключился ли пользователь во время загрузки
            if (currentSelectedUserId !== telegramId) return;

            let html = '';
            messages.forEach(msg => {
                // Вопрос пользователя
                html += `
                    <div class="msg-wrapper user">
                        <div class="msg-bubble">${escapeHtml(msg.question)}</div>
                        <div class="msg-time">${formatDate(msg.created_at)}</div>
                    </div>
                `;
                // Ответ бота
                html += `
                    <div class="msg-wrapper bot">
                        <div class="msg-bubble">${formatBotAnswer(msg.answer)}</div>
                        <div class="msg-time">Ассистент</div>
                    </div>
                `;
            });

            // Определяем, нужно ли прокручивать вниз (если скролл был в самом низу)
            const isScrolledToBottom = chatEl.scrollHeight - chatEl.clientHeight <= chatEl.scrollTop + 50;

            chatEl.innerHTML = html || '<div class="empty-state">Нет сообщений</div>';

            // Если только загрузили или были внизу - скроллим вниз
            if (chatEl.dataset.loadingId === String(telegramId) || isScrolledToBottom) {
                 chatEl.scrollTop = chatEl.scrollHeight;
                 delete chatEl.dataset.loadingId;
            }

        } catch (err) {
            console.error('Ошибка загрузки сообщений чата', err);
            document.getElementById('chat-messages').innerHTML = '<div class="empty-state">Ошибка загрузки</div>';
        }
    }

    // ── Действия ────────────────────────────────────────
    window.selectUser = function(telegramId, username) {
        currentSelectedUserId = telegramId;
        
        // Включаем мобильный режим чата
        document.querySelector('.app-container').classList.add('chat-active');
        
        // Обновляем заголовок чата
        document.getElementById('chat-header').style.display = 'flex';
        document.getElementById('chat-title').textContent = `@${username}`;
        document.getElementById('chat-sub').textContent = `ID: ${telegramId}`;

        // Подсвечиваем в списке
        document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
        const target = Array.from(document.querySelectorAll('.user-item')).find(el => el.getAttribute('onclick').includes(telegramId));
        if (target) target.classList.add('active');

        // Загружаем сообщения
        loadUserMessages(telegramId);
    };

    window.backToList = function() {
        document.querySelector('.app-container').classList.remove('chat-active');
    };

    // ── WhatsApp ─────────────────────────────────────────
    let isWaModalOpen = false;
    let lastQrString = '';

    function openWaModal() {
        isWaModalOpen = true;
        document.getElementById('wa-modal').classList.add('open');
        checkWaStatus();
    }
    
    function closeWaModal() {
        isWaModalOpen = false;
        document.getElementById('wa-modal').classList.remove('open');
    }

    async function checkWaStatus() {
        try {
            const resp = await fetch(`${API_BASE}/api/whatsapp/status`);
            const data = await resp.json();
            
            const dot = document.getElementById('wa-dot');
            const text = document.getElementById('wa-status-text');
            const desc = document.getElementById('wa-modal-desc');
            const qrContainer = document.getElementById('qr-container');
            const logoutBtn = document.getElementById('wa-logout-btn');

            dot.className = 'wa-dot';
            
            if (data.status === 'READY' || data.status === 'AUTHENTICATED') {
                dot.classList.add('online');
                text.textContent = 'Подключено';
                desc.textContent = 'WhatsApp успешно подключен и работает!';
                qrContainer.innerHTML = '<div style="font-size: 40px; margin: 20px;">✅</div>';
                logoutBtn.style.display = 'inline-block';
                lastQrString = '';
            } else if (data.status === 'QR_READY') {
                dot.classList.add('qr');
                text.textContent = 'Скан QR';
                desc.textContent = 'Откройте WhatsApp -> Связанные устройства и отсканируйте код';
                logoutBtn.style.display = 'none';
                
                if (isWaModalOpen && data.qr && data.qr !== lastQrString) {
                    qrContainer.innerHTML = '';
                    new QRCode(qrContainer, {
                        text: data.qr,
                        width: 320,
                        height: 320,
                        colorDark : "#000000",
                        colorLight : "#ffffff",
                    });
                    lastQrString = data.qr;
                }
            } else {
                dot.classList.add('offline');
                text.textContent = 'Инициализация';
                desc.textContent = 'Сервис WhatsApp сейчас запускается... Подождите пару минут.';
                qrContainer.innerHTML = '';
                logoutBtn.style.display = 'none';
                lastQrString = '';
            }
        } catch (e) {
            document.getElementById('wa-dot').className = 'wa-dot offline';
            document.getElementById('wa-status-text').textContent = 'OFFLINE';
            document.getElementById('wa-modal-desc').textContent = 'Ошибка подключения к серверу.';
            document.getElementById('qr-container').innerHTML = '';
            document.getElementById('wa-logout-btn').style.display = 'none';
            lastQrString = '';
        }
    }

    async function logoutWa() {
        if (!confirm('Вы уверены, что хотите отвязать WhatsApp?')) return;
        
        try {
            const btn = document.getElementById('wa-logout-btn');
            btn.textContent = 'Отвязываем...';
            btn.disabled = true;
            
            await fetch(`${API_BASE}/api/whatsapp/logout`, { method: 'POST' });
            
            setTimeout(() => {
                btn.textContent = 'Отвязать WhatsApp';
                btn.disabled = false;
                checkWaStatus();
            }, 2000);
            
        } catch (err) {
            alert('Ошибка при отвязке WhatsApp');
        }
    }

    // ── Тема ───────────────────────────────────────────
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon();
    }

    function updateThemeIcon() {
        const btn = document.getElementById('theme-toggle-btn');
        const currentTheme = document.documentElement.getAttribute('data-theme');
        btn.textContent = currentTheme === 'light' ? '🌙' : '☀️';
    }

    // ── Жизненный цикл ──────────────────────────────────
    async function init() {
        updateThemeIcon();
        await Promise.all([loadStats(), loadUsersList()]);
        checkWaStatus();
        
        // Автообновление данных (каждые 10 минут)
        autoRefreshInterval = setInterval(async () => {
            await Promise.all([loadStats(), loadUsersList()]);
            if (currentSelectedUserId) {
                await loadUserMessages(currentSelectedUserId);
            }
        }, 600000);
        
        // Автообновление QR-кода (каждые 3 секунды)
        setInterval(() => {
            if (isWaModalOpen) {
                checkWaStatus();
            }
        }, 3000);
    }

    init();
</script>
