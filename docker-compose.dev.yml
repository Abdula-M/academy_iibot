# ============================================================
#  Только инфраструктура (PG + Redis) для локальной разработки
#  Бот запускается отдельно через: uvicorn main:app --reload
# ============================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_bot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_to_strong_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-bot-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  whatsapp:
    build:
      context: ./whatsapp/microservice
      dockerfile: Dockerfile
    container_name: ai-bot-whatsapp
    restart: unless-stopped
    env_file: .env
    environment:
      - WEBHOOK_URL=http://host.docker.internal:8000/api/whatsapp/webhook
    ports:
      - "3001:3000"
    volumes:
      - whatsapp_data:/app/.wwebjs_auth
      - ./data:/app/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_data:
  whatsapp_data:
