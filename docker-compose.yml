# ============================================================
# Docker Compose — продакшен-конфигурация AI Telegram Bot
#
# Сервисы:
#   bot      — FastAPI + aiogram (Webhook)
#   postgres — PostgreSQL 15 (основная БД)
#   redis    — Redis 7 (FSM storage для aiogram)
#
# Запуск:
#   docker compose up -d --build
#
# Логи:
#   docker compose logs -f bot
# ============================================================

services:
  # ── Приложение (бот) ───────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-bot-image:v3
    container_name: ai-bot
    restart: unless-stopped
    # env_file: .env
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - USE_WEBHOOK=${USE_WEBHOOK:-false}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - WHATSAPP_SERVICE_URL=${WHATSAPP_SERVICE_URL:-http://whatsapp:3000/send}
      - INSTAGRAM_VERIFY_TOKEN=${INSTAGRAM_VERIFY_TOKEN}
      - INSTAGRAM_ACCESS_TOKEN=${INSTAGRAM_ACCESS_TOKEN}
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEBUG=${DEBUG:-false}
    ports:
      - "${BOT_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          memory: 256M                   # FastAPI ~80-120MB, 256M — с запасом
        reservations:
          memory: 64M

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ai-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_bot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          memory: 256M                   # PostgreSQL Alpine ~100-150MB

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-bot-redis
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 64mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          memory: 96M                    # Redis с maxmemory 64mb

  # ── WhatsApp Microservice (Baileys — без Chromium) ───────────
  whatsapp:
    build:
      context: .
      dockerfile: whatsapp/baileys/Dockerfile
    image: ai-whatsapp-baileys:v1
    container_name: ai-bot-whatsapp
    restart: unless-stopped
    environment:
      - WEBHOOK_URL=http://bot:8000/api/whatsapp/webhook
    ports:
      - "3005:3000"
    volumes:
      - whatsapp_baileys_data:/app/.baileys_auth
      - ./data:/app/data
    networks:
      - bot-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M     # Baileys: ~50-100MB (без Chromium)

  # ── Frontend (React Dashboard) ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-bot-frontend
    restart: unless-stopped
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          memory: 128M
  caddy:
    image: caddy:2-alpine
    container_name: ai-bot-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          memory: 128M

# ── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  whatsapp_data:
    driver: local
  whatsapp_baileys_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# ── Network ──────────────────────────────────────────────────
networks:
  bot-network:
    driver: bridge
